<!DOCTYPE html>
<html>
<head>
<title>Link-Up 1.0 Chat</title>
<style>
body{font-family:Arial;background:#eee;padding:20px}
.box{background:white;padding:20px;border-radius:20px;max-width:600px;margin:auto}
input,button{width:100%;padding:12px;margin:5px;border-radius:15px}
button{background:#20a84a;color:white;border:0}
#chatArea{display:none}
#messages{height:300px;overflow:auto;background:#f5f5f5;padding:10px}
.msg{background:white;padding:10px;margin:5px;border-radius:15px}
</style>
</head>
<body>

<div class="box">
<h1>Link-Up 1.0 Beta</h1>

<h3 id="account">Not logged in</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="signup">Sign Up</button>
<button id="login">Login</button>
<button id="logout">Logout</button>

<hr>

<input id="searchEmail" placeholder="Search user email">
<button id="search">Search User</button>
<div id="result"></div>

<div id="chatArea">
<h3 id="chatTitle"></h3>
<div id="messages"></div>
<input id="message" placeholder="Type message and press Enter">
</div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,get,push,onValue,remove,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyASngTibn8_qQYMxKE5WwBfxJaZZlHYQdA",
authDomain:"contactchat67.firebaseapp.com",
databaseURL:"https://contactchat67-default-rtdb.firebaseio.com",
projectId:"contactchat67",
storageBucket:"contactchat67.appspot.com",
messagingSenderId:"986424533908",
appId:"1:986424533908:web:54e616c9424a014959e581"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let currentChat=null;

const $=x=>document.getElementById(x);

$("signup").onclick=async()=>{
try{
let u=await createUserWithEmailAndPassword(auth,$("email").value,$("password").value);
await set(ref(db,"users/"+u.user.uid),{
name:$("name").value,
email:$("email").value.toLowerCase(),
online:true
});
alert("Account created");
}catch(e){alert(e.message)}
};

$("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,$("email").value,$("password").value);
}catch(e){alert(e.message)}
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
if(user){
let r=ref(db,"users/"+user.uid);
let d=await get(r);

if(!d.exists()){
await set(r,{name:user.email.split("@")[0],email:user.email});
d=await get(r);
}

$("account").innerHTML="Logged in: "+d.val().name;

let online=ref(db,"users/"+user.uid+"/online");
set(online,true);
onDisconnect(online).set(false);

}else{
$("account").innerHTML="Not logged in";
}
});

$("search").onclick=async()=>{
$("result").innerHTML="";
let users=await get(ref(db,"users"));

users.forEach(u=>{
if(u.val().email===$("searchEmail").value.toLowerCase()){
let b=document.createElement("button");
b.innerHTML=u.val().name;
b.onclick=()=>openChat(u.key,u.val().name);
$("result").appendChild(b);
}
});
};

function openChat(uid,name){

currentChat=[auth.currentUser.uid,uid].sort().join("_");

$("chatArea").style.display="block";
$("chatTitle").innerHTML="Chat with "+name;

onValue(ref(db,"chats/"+currentChat),s=>{

$("messages").innerHTML="";

s.forEach(c=>{

let m=c.val();

$("messages").innerHTML+=`
<div class="msg">
<b>${m.name}</b><br>
${m.text}<br>
<button onclick="deleteMessage('${currentChat}','${c.key}')">🗑 Delete</button>
</div>`;

});

});

}

$("message").onkeydown=async e=>{

if(e.key==="Enter" && currentChat){

let p=await get(ref(db,"users/"+auth.currentUser.uid));

await push(ref(db,"chats/"+currentChat),{
uid:auth.currentUser.uid,
name:p.val().name,
text:$("message").value,
time:Date.now()
});

$("message").value="";

}

};

window.deleteMessage=async function(chat,id){

await remove(ref(db,"chats/"+chat+"/"+id));

};

</script>

</body>
</html>
